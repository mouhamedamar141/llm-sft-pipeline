# Model
model_name: allenai/OLMo-2-0425-1B
chat_template_source: allenai/OLMo-2-0425-1B-SFT  

# Dataset 
dataset_name: HuggingFaceH4/no_robots
dataset_split: train
max_samples: null  # use all ~9.5K rows
max_length: 2048

# Training
lr: 5.0e-6
num_epochs: 3
batch_size: 4
gradient_accumulation_steps: 8  
warmup_ratio: 0.1
weight_decay: 0.0
max_grad_norm: 1.0
seed: 42

bf16: true
gradient_checkpointing: true
model_device_id: 0

sample_every: 50
sample_max_tokens: 128
sample_max_input_tokens: 512
sample_temperature: 0.7
sample_top_p: 0.9
sample_do_sample: true

wandb_project: null  
wandb_run_name: instruction_tuning_no_robots
